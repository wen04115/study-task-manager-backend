name: study-task

services:
  backend:
    build:
      context: .
    env_file:
      - .env
    environment:
      MYSQL_HOST: host.docker.internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:?请设置前端项目路径FRONTEND_CONTEXT}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy