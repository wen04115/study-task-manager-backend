name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend isolated tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3306"
      MYSQL_USER: "unused_test_user"
      MYSQL_PASSWORD: "unused_test_password"
      MYSQL_DATABASE: "unused_test_database"
      JWT_SECRET_KEY: "ci-only-test-secret-not-for-real-use-2026"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx==0.28.1

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run isolated tests
        run: python -B -m unittest discover -s tests -p "test_tasks_isolated.py" -v